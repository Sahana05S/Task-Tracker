name: Apply migrations to the live database

# Applies every migration in supabase/migrations that the live database
# (Supabase project bdezjektaeqxcntuxqcw since the 1 November 2026 go-live; the
# old demo project sbtxtsisjhuciobxykcm is no longer a target) has not recorded
# yet, so merging a PR with a migration needs no laptop. Runs when a migration
# reaches main, and by hand from the Actions tab (Run workflow). The file keeps
# its old name because deploy-production.yml waits for it by name.
#
# 1. plan: refuses unless SUPABASE_DB_URL is the live project, then lists the
#    files whose version is missing from supabase_migrations.schema_migrations
#    (gaps included, like `db push --include-all`). Nothing missing: stops here.
#    A new project has no ledger yet: every file is pending and the run is a
#    fresh install.
# 2. backup: the encrypted backup from db-backup.yml, taken before any change.
#    Skipped on a fresh install (an empty database has nothing to keep).
# 3. apply: creates the ledger if it is missing, then each missing file in
#    version order with psql. The ledger row is written inside the migration's
#    own BEGIN ... COMMIT, so a failed migration body leaves no row and the run
#    stops at it (GitHub emails the owner). Migrations 41-103 call m15_secure()
#    after that COMMIT, so a failure there is recorded as applied: step 3b
#    covers it.
# 3b. secure: after apply (whether it ran, failed or had nothing to do), lists
#    tables and functions m15_secure() would still change
#    (supabase/checks/m15_unsecured.sql), runs it only if there are any, and
#    fails the run if any remain. A re-run therefore repairs a gap left by an
#    earlier failure even when no migration is pending.
#
# 4. functions: deploys the Edge Functions in supabase/functions (send-push
#    without JWT verification, it checks its own bearer secret; decay-freshness
#    as before) once the migrations are in. Skipped with a notice until the
#    secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF exist.
#
# Uses the repository secrets SUPABASE_DB_URL and BACKUP_PASSPHRASE (see
# docs/OPERATIONS.md "Database backups"). Never rewrite an applied migration:
# a changed file with a recorded version is not re-run.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/migrate-demo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-live
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.plan.outputs.pending }}
      fresh: ${{ steps.plan.outputs.fresh }}
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      LIVE_REF: bdezjektaeqxcntuxqcw
    steps:
      - uses: actions/checkout@v4

      - name: Check the target is the live project
        run: |
          set -euo pipefail
          [ -n "$SUPABASE_DB_URL" ] || { echo "::error::Secret SUPABASE_DB_URL is not set"; exit 1; }
          case "$SUPABASE_DB_URL" in
            *"postgres.${LIVE_REF}:"* | *"@db.${LIVE_REF}.supabase.co"*) ;;
            *) echo "::error::SUPABASE_DB_URL is not the live project ${LIVE_REF}; refusing"; exit 1 ;;
          esac

      - name: List migrations the database has not recorded
        id: plan
        run: |
          set -euo pipefail
          ledger="$(psql "$SUPABASE_DB_URL" -XAtq -v ON_ERROR_STOP=1 \
            -c "SELECT to_regclass('supabase_migrations.schema_migrations') IS NOT NULL")"
          applied=""
          if [ "$ledger" = t ]; then
            applied="$(psql "$SUPABASE_DB_URL" -XAtq -v ON_ERROR_STOP=1 \
              -c 'SELECT version FROM supabase_migrations.schema_migrations ORDER BY version')"
          fi
          if [ -z "$applied" ]; then
            tables="$(psql "$SUPABASE_DB_URL" -XAtq -v ON_ERROR_STOP=1 \
              -c "SELECT count(*) FROM pg_tables WHERE schemaname IN ('public', 'taskpulse_private')")"
            [ "$tables" = 0 ] || { echo "::error::No migrations are recorded but the database already has $tables tables; refusing a fresh install over existing data"; exit 1; }
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
          fi
          pending=""
          while IFS= read -r f; do
            base="$(basename "$f" .sql)"
            [[ "$base" =~ ^[0-9]+_[a-z0-9_]+$ ]] || { echo "::error::Unexpected migration name: $base"; exit 1; }
            grep -qxF "${base%%_*}" <<<"$applied" || pending="$pending $base"
          done < <(printf '%s\n' supabase/migrations/*.sql | sort -V)
          pending="${pending# }"
          echo "pending=$pending" >> "$GITHUB_OUTPUT"
          {
            echo "## Live database migrations"
            echo ""
            if [ -z "$applied" ]; then
              echo "No migrations recorded yet: fresh install (no backup needed)."
            else
              echo "Latest recorded version: $(sort -V <<<"$applied" | tail -n 1)"
            fi
            echo ""
            if [ -z "$pending" ]; then
              echo "Nothing to apply."
            else
              echo "To apply, in this order:"
              for b in $pending; do echo "- \`$b.sql\`"; done
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  backup:
    needs: plan
    if: needs.plan.outputs.pending != '' && needs.plan.outputs.fresh != 'true'
    uses: ./.github/workflows/db-backup.yml
    secrets: inherit

  apply:
    needs: [plan, backup]
    # After a successful backup, or with none on a fresh install; never after a failed one.
    if: >-
      always() && needs.plan.result == 'success' && needs.plan.outputs.pending != '' &&
      (needs.backup.result == 'success' || (needs.backup.result == 'skipped' && needs.plan.outputs.fresh == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      PENDING: ${{ needs.plan.outputs.pending }}
    steps:
      - uses: actions/checkout@v4

      - name: Apply
        run: |
          set -euo pipefail
          # Same ledger the Supabase CLI keeps; a new project does not have it yet.
          psql "$SUPABASE_DB_URL" -X -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE SCHEMA IF NOT EXISTS supabase_migrations;
          CREATE TABLE IF NOT EXISTS supabase_migrations.schema_migrations (
            version text PRIMARY KEY, statements text[], name text);
          SQL
          for base in $PENDING; do
            src="supabase/migrations/$base.sql"
            tmp="$RUNNER_TEMP/$base.sql"
            ins="INSERT INTO supabase_migrations.schema_migrations (version, name) VALUES ('${base%%_*}', '${base#*_}');"
            last="$(grep -niE '^[[:space:]]*COMMIT[[:space:]]*;' "$src" | tail -n 1 | cut -d: -f1 || true)"
            echo "::group::$base"
            if [ -n "$last" ]; then
              # Record the version just before the migration's own COMMIT.
              awk -v n="$last" -v ins="$ins" 'NR == n { print ins } { print }' "$src" > "$tmp"
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f "$tmp"
            else
              { cat "$src"; echo; echo "$ins"; } > "$tmp"
              psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 --single-transaction -f "$tmp"
            fi
            echo "::endgroup::"
            echo "- applied \`$base.sql\`" >> "$GITHUB_STEP_SUMMARY"
          done
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -c "NOTIFY pgrst, 'reload schema'"
          latest="$(psql "$SUPABASE_DB_URL" -XAtq -v ON_ERROR_STOP=1 \
            -c 'SELECT max(version::int) FROM supabase_migrations.schema_migrations')"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Latest recorded version now: $latest" >> "$GITHUB_STEP_SUMMARY"

  secure:
    needs: [plan, apply]
    # Also after a failed or skipped apply: that is when a gap can exist.
    if: always() && needs.plan.result == 'success' && needs.apply.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Every table and function is company-scoped
        run: |
          set -euo pipefail
          check() { psql "$SUPABASE_DB_URL" -XAtq -v ON_ERROR_STOP=1 -f supabase/checks/m15_unsecured.sql; }
          gap="$(check)"
          if [ -z "$gap" ]; then echo "Nothing to secure."; exit 0; fi
          echo "::warning::Not yet secured by m15_secure():"; echo "$gap"
          found="$gap"
          # m15_secure() locks every table in turn; retry if live traffic holds a lock.
          for attempt in 1 2 3; do
            if psql "$SUPABASE_DB_URL" -XAtq -v ON_ERROR_STOP=1 -c "SET lock_timeout = '10s'" -c 'SELECT taskpulse_private.m15_secure()'; then break; fi
            echo "::warning::m15_secure() attempt $attempt failed; retrying"; sleep 20
          done
          gap="$(check)"
          if [ -n "$gap" ]; then echo "::error::Still not secured:"; echo "$gap"; exit 1; fi
          {
            echo ""
            echo "Secured objects that a failed run had left without company scope:"
            echo '```'; echo "$found"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Secured."

  functions:
    needs: [plan, apply]
    # After the migrations (or when none were missing); never after a failed apply.
    if: always() && needs.plan.result == 'success' && (needs.apply.result == 'success' || needs.apply.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      LIVE_REF: bdezjektaeqxcntuxqcw
    steps:
      - uses: actions/checkout@v4

      - name: Check the deploy secrets
        id: gate
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::notice::Edge Functions not deployed: add the secrets SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF (docs/OPERATIONS.md, Phone notifications)."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [ "$SUPABASE_PROJECT_REF" = "$LIVE_REF" ] || { echo "::error::SUPABASE_PROJECT_REF is not the live project ${LIVE_REF}; refusing"; exit 1; }
          echo "deploy=true" >> "$GITHUB_OUTPUT"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3, pinned (CodeQL actions/unpinned-tag)
        if: steps.gate.outputs.deploy == 'true'
        with:
          version: 2.122.0 # a fixed CLI, not the newest release at run time

      - name: Deploy Edge Functions
        if: steps.gate.outputs.deploy == 'true'
        run: |
          set -euo pipefail
          supabase functions deploy send-push --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt --use-api
          supabase functions deploy decay-freshness --project-ref "$SUPABASE_PROJECT_REF" --use-api
          {
            echo "## Edge Functions"
            echo ""
            echo "- deployed \`send-push\` (bearer secret, no JWT verification)"
            echo "- deployed \`decay-freshness\`"
          } >> "$GITHUB_STEP_SUMMARY"
