name: Local contract checks (not native acceptance)

on:
  push:
  pull_request:
  workflow_dispatch:

# Pull-request code runs here: the token can only read.
permissions:
  contents: read

jobs:
  app:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build

  postgres-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
          POSTGRES_DB: postgres
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Client tools match the postgres:16 service. The runner's default client
      # moved past 16, and a newer pg_dump writes settings (transaction_timeout,
      # PostgreSQL 17) that a 16 server rejects on restore (29 October 2026).
      - name: Install PostgreSQL 16 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-16
          echo /usr/lib/postgresql/16/bin >> "$GITHUB_PATH"
          /usr/lib/postgresql/16/bin/pg_dump --version
      # Autovacuum's ANALYZE of the M15 bookkeeping tables can deadlock with
      # m15_secure() re-applying RLS (seen on migration 63, 27 October 2026).
      # This server is thrown away after the job, so it never needs vacuuming.
      - name: Turn off autovacuum on the disposable server
        run: |
          psql -h 127.0.0.1 -p 15432 -U postgres -d postgres -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET autovacuum = off" -c "SELECT pg_reload_conf()"
          test "$(psql -h 127.0.0.1 -p 15432 -U postgres -d postgres -Atc 'SHOW autovacuum')" = off
      - name: Fresh install and upgrade of every migration, M12 month close (migration 29) with role-shim checks
        run: python tools/test_m12_database.py --psql "$(command -v psql)" --port 15432
      - name: Disposable logical backup and restore
        run: python tools/test_m13_recovery.py --bin-dir "$(dirname "$(command -v psql)")" --port 15432
      - name: M14 nested checklist pages
        run: python tools/test_m14_database.py --psql "$(command -v psql)" --port 15432
      - name: M15 tenancy and company-scoped commands
        run: python tools/test_m15_database.py --psql "$(command -v psql)" --port 15432
      - name: M16 recognition streaks (migration 45)
        run: python tools/test_m16_database.py --psql "$(command -v psql)" --port 15432
      - name: M17 sales factor mapping (migration 46)
        run: python tools/test_m17_sales_database.py --psql "$(command -v psql)" --port 15432
      - name: M15 award invalidation company scope (migration 48)
        run: python tools/test_m15_award_invalidation_database.py --psql "$(command -v psql)" --port 15432
      - name: Award invalidation once per transaction (migration 60)
        run: python tools/test_m60_award_invalidation_once_database.py --psql "$(command -v psql)" --port 15432
      - name: Award read model last decided result (migration 62)
        run: python tools/test_m62_award_last_decided_database.py --psql "$(command -v psql)" --port 15432
      - name: Checklist one kind of row (migration 63)
        run: python tools/test_m63_checklist_rows_database.py --psql "$(command -v psql)" --port 15432
      - name: Objectives and sub-quests (migration 109)
        run: python tools/test_checklist_subquests_database.py --psql "$(command -v psql)" --port 15432
      - name: Timer session activity, concurrent timers and Quest timers (migrations 110, 118, 123)
        run: python tools/test_timer_session_activity_database.py --psql "$(command -v psql)" --port 15432
      - name: Company branding (migration 64)
        run: python tools/test_m64_company_branding_database.py --psql "$(command -v psql)" --port 15432
      - name: Conflict errors without PostgREST retries (migration 52)
        run: python tools/test_conflict_sqlstate_database.py --psql "$(command -v psql)" --port 15432
      - name: M16 recognition waypoints (migration 51)
        run: python tools/test_m18_waypoints_database.py --psql "$(command -v psql)" --port 15432
      - name: Activity log read (migrations 54 and 57)
        run: python tools/test_activity_feed_database.py --psql "$(command -v psql)" --port 15432
      - name: Company settings, tag allocator, holiday default and break times (migrations 53, 119)
        run: python tools/test_company_settings_database.py --psql "$(command -v psql)" --port 15432
      - name: Policies and notifications (migrations 56 and 58)
        run: python tools/test_policies_database.py --psql "$(command -v psql)" --port 15432
      - name: Month setup wizard (migration 55)
        run: python tools/test_month_setup_database.py --psql "$(command -v psql)" --port 15432
      - name: New mission scale mode and company default (migration 61)
        run: python tools/test_mission_scale_mode_database.py --psql "$(command -v psql)" --port 15432
      - name: Notes with hashtags on the mission page (migrations 111, 126)
        run: python tools/test_mission_learnings_database.py --psql "$(command -v psql)" --port 15432
      - name: Workspace labels (migration 112)
        run: python tools/test_workspace_labels_database.py --psql "$(command -v psql)" --port 15432
      - name: Objective review and Work needed (migration 114)
        run: python tools/test_objective_review_database.py --psql "$(command -v psql)" --port 15432
      - name: Demo recognition seed (script only, loopback)
        run: python tools/test_seed_demo_recognition_database.py --psql "$(command -v psql)" --port 15432 --manifest-dir "$RUNNER_TEMP/demo-recognition"
      - name: Mission people, collaborators and observers (migration 108)
        run: python tools/test_task_people_database.py --psql "$(command -v psql)" --port 15432
      - name: Task Tools copies keep collaborators and observers in their roles (migration 115)
        run: python tools/test_task_tools_people_database.py --psql "$(command -v psql)" --port 15432
      - name: Permanent missions (migration 135)
        run: python tools/test_permanent_missions_database.py --psql "$(command -v psql)" --port 15432
      - name: Install openpyxl for the sheet tools
        run: python -m pip install openpyxl==3.1.5
      - name: Attendance import from the billed attendance sheet (script only, loopback)
        run: python tools/test_attendance_import_database.py --psql "$(command -v psql)" --port 15432 --manifest-dir "$RUNNER_TEMP/attendance-import"
