name: Nightly award run

# Calls the app's award worker (POST /api/internal/awards) after the daily
# cutoff. Each call queues due award days through yesterday (Asia/Kolkata) and
# runs up to 10 jobs; this keeps calling until a batch comes back empty. Then it
# calls the policies worker (POST /api/internal/policies, same token and
# switch) until no policy period is due, and finally removes check-in photos
# older than each company's retention (POST /api/internal/attendance-photos).
#
# Needs repository secrets APP_URL (e.g. https://task-tracker-gules-ten.vercel.app)
# and TASKPULSE_AWARD_WORKER_TOKEN, plus on Vercel: TASKPULSE_AWARD_WORKER_ENABLED=production,
# the same TASKPULSE_AWARD_WORKER_TOKEN and SUPABASE_SERVICE_ROLE_KEY.
#
# The job fails (and GitHub emails the owner) on HTTP errors or any `failed` job.
# `blocked` days are missing-data days the app already shows; they are counted
# in the summary but do not fail the run.

on:
  schedule:
    - cron: '45 18 * * *' # 00:15 Asia/Kolkata, after the 23:59 daily cutoff
  workflow_dispatch:

permissions: {}

concurrency:
  group: award-worker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run award batches until the queue is empty
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TOKEN: ${{ secrets.TASKPULSE_AWARD_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::APP_URL and TASKPULSE_AWARD_WORKER_TOKEN secrets are required."
            exit 1
          fi
          all='[]'
          for batch in $(seq 1 10); do
            code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${TOKEN}" "${APP_URL%/}/api/internal/awards")
            if [ "$code" != "200" ]; then
              echo "::error::Batch ${batch} returned HTTP ${code}: $(cat response.json)"
              exit 1
            fi
            if [ "$batch" = "1" ] && jq -e '[.schedule.companies[]?.result.enabled] | any(. == false)' response.json >/dev/null; then
              echo "::warning::The database award schedule is off (award_policy.schedule_enabled); no new days were queued."
              echo "> The database award schedule is off, so no new days were queued." >> "$GITHUB_STEP_SUMMARY"
            fi
            outcomes=$(jq -c '.outcomes // []' response.json)
            all=$(jq -c --argjson a "$all" --argjson b "$outcomes" -n '$a + $b')
            [ "$(jq 'length' <<<"$outcomes")" -eq 0 ] && break
          done
          {
            echo "### Award run"
            echo ""
            echo "| Status | Jobs |"
            echo "| --- | --- |"
            jq -r 'group_by(.status) | map("| \(.[0].status) | \(length) |") | .[]' <<<"$all"
            echo ""
            echo "Total jobs: $(jq 'length' <<<"$all")"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=$(jq '[.[] | select(.status == "failed")] | length' <<<"$all")
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} award job(s) failed; inspect retained jobs in the app."
            exit 1
          fi

      # Second loop: policies (migration 56). Each call evaluates up to 20 due
      # policy periods per company and reports what is left; failures are
      # recorded in the app as failed runs (the directors are notified there).
      - name: Run policy evaluations until nothing is due
        # Policies do not depend on the award run, so a failed award step does not skip them.
        if: ${{ !cancelled() }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TOKEN: ${{ secrets.TASKPULSE_AWARD_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${TOKEN:-}" ]; then
            echo "::error::APP_URL and TASKPULSE_AWARD_WORKER_TOKEN secrets are required."
            exit 1
          fi
          all='[]'
          for batch in $(seq 1 20); do
            code=$(curl -sS -o response.json -w '%{http_code}' -X POST \
              -H "Authorization: Bearer ${TOKEN}" "${APP_URL%/}/api/internal/policies")
            if [ "$code" != "200" ]; then
              echo "::error::Policies batch ${batch} returned HTTP ${code}: $(cat response.json)"
              exit 1
            fi
            outcomes=$(jq -c '.outcomes // []' response.json)
            all=$(jq -c --argjson a "$all" --argjson b "$outcomes" -n '$a + $b')
            [ "$(jq '.remaining // 0' response.json)" -eq 0 ] && break
          done
          {
            echo "### Policy evaluations"
            echo ""
            echo "| Status | Company passes | Periods | Changed | Notified |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r 'group_by(.status) | map("| \(.[0].status) | \(length) | \(map(.periods) | add) | \(map(.changed) | add) | \(map(.notified) | add) |") | .[]' <<<"$all"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$(jq '.remaining // 0' response.json)" -gt 0 ]; then
            echo "::warning::Policy periods are still due after 20 batches; they continue tomorrow."
          fi
          failed=$(jq '[.[] | select(.status == "failed")] | length' <<<"$all")
          if [ "$failed" -gt 0 ]; then
            echo "::error::${failed} company pass(es) failed: $(jq -c '[.[] | select(.status == "failed") | {organizationId, errorCode}]' <<<"$all")"
            exit 1
          fi

      # Third loop: check-in photos past each company's retention (migration 72).
      - name: Remove expired check-in photos
        if: ${{ !cancelled() }}
        env:
          APP_URL: ${{ secrets.APP_URL }}
          TOKEN: ${{ secrets.TASKPULSE_AWARD_WORKER_TOKEN }}
        run: |
          set -euo pipefail
          removed=0
          for batch in $(seq 1 10); do
            code=$(curl -sS -o response.json -w '%{http_code}' -X POST               -H "Authorization: Bearer ${TOKEN}" "${APP_URL%/}/api/internal/attendance-photos")
            if [ "$code" != "200" ]; then
              echo "::error::Photo clean-up batch ${batch} returned HTTP ${code}: $(cat response.json)"
              exit 1
            fi
            removed=$((removed + $(jq '.removed // 0' response.json)))
            [ "$(jq '.remaining // 0' response.json)" -eq 0 ] && break
          done
          echo "### Check-in photos removed: ${removed}" >> "$GITHUB_STEP_SUMMARY"
