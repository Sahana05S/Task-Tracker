name: Playwright (public pages)

# Anonymous browser checks only: landing, sign-in, password reset, the edge
# guard and API refusals, against a production build with placeholder
# Supabase settings. Signed-in role runs need QA accounts; see tests/e2e/README.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Pull-request code runs here: the token can only read.
permissions:
  contents: read

jobs:
  public:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=public --project=public-mobile
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
