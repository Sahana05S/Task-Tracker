<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7061F5"/>
      <stop offset="50%" stop-color="#5544E0"/>
      <stop offset="100%" stop-color="#3C2DB8"/>
    </linearGradient>

    <!-- Star Glow Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE770"/>
      <stop offset="45%" stop-color="#FFC837"/>
      <stop offset="100%" stop-color="#FF9800"/>
    </linearGradient>

    <!-- Pulse Wave Gradient -->
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A594FF" stop-opacity="0.3"/>
      <stop offset="40%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>

    <!-- Outer Soft Glow Shadow -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4B39B5" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.12"/>
    </filter>

    <!-- Star Glow Filter -->
    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle App Badge Container -->
  <rect x="36" y="36" width="440" height="440" rx="112" fill="url(#bgGrad)" filter="url(#badgeShadow)"/>

  <!-- Subtle Inner Glass/Light Ring -->
  <rect x="38" y="38" width="436" height="436" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>

  <!-- Dynamic Aurora Background Wave within Icon -->
  <path d="M 40 330 C 120 280, 200 370, 310 320 C 390 280, 440 310, 474 340 L 474 440 C 474 460, 458 474, 438 474 L 148 474 C 88 474, 40 426, 40 366 Z" fill="#4332B8" opacity="0.4"/>

  <!-- Checkmark / Pulse Rhythm Line traversing behind star -->
  <path d="M 96 264 L 168 264 L 208 328 L 256 168 L 304 328 L 344 264 L 416 264" 
        fill="none" 
        stroke="url(#pulseGrad)" 
        stroke-width="18" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        opacity="0.85"/>

  <!-- Central Star Burst Emblem (Gamified Recognition Mascot Core) -->
  <g filter="url(#starGlow)" transform="translate(256, 256)">
    <!-- 4-point Dynamic Sparkle Star with curved bevels -->
    <path d="M 0 -104 
             C 12 -42, 42 -12, 104 0 
             C 42 12, 12 42, 0 104 
             C -12 42, -42 12, -104 0 
             C -42 -12, -12 -42, 0 -104 Z" 
          fill="url(#goldGrad)"/>

    <!-- Inner Core White Diamond Accent -->
    <path d="M 0 -44 
             C 5 -18, 18 -5, 44 0 
             C 18 5, 5 18, 0 44 
             C -5 18, -18 5, -44 0 
             C -18 -5, -5 -18, 0 -44 Z" 
          fill="#FFFFFF" 
          opacity="0.92"/>

    <!-- Small Sparkle Dots / Gamification Accents -->
    <circle cx="82" cy="-78" r="9" fill="#FFF385" filter="url(#starGlow)"/>
    <circle cx="-86" cy="80" r="6.5" fill="#34D399" opacity="0.9"/>
  </g>

  <!-- Mint Pulse Complete Accent Dot -->
  <circle cx="416" cy="264" r="11" fill="#34D399"/>
</svg>
